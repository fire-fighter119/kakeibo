<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>家計簿｜使ったお金を記録</title>
<style>
  :root{--coral:#ff6f61;--coral-dark:#df594d;--coral-pale:#fff0eb;--cream:#fff3e0;--ink:#342f2c;--muted:#746963;--line:#ecdcd2;--teal:#4db6ac}
  *{box-sizing:border-box} body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.5;padding:18px 12px 42px}
  main{max-width:460px;margin:auto;background:#fff;border-radius:24px;padding:24px 20px;box-shadow:0 10px 28px rgba(95,60,35,.1)}
  h1,p{margin:0} header{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;gap:12px} h1{font-size:21px;color:var(--coral-dark)} .flow{font-size:11px;color:var(--muted);white-space:nowrap}
  .block{margin-top:23px}.block:first-of-type{margin-top:0}.label{display:block;font-size:16px;font-weight:800;margin:0 0 9px}.step{display:inline-grid;place-items:center;width:22px;height:22px;margin-right:6px;border-radius:50%;background:var(--coral-pale);color:var(--coral-dark);font-size:12px}
  select,input,textarea,button{font:inherit} select,input[type="number"],textarea{display:block;width:100%;border:2px solid #ffb39e;border-radius:13px;background:#fffaf7;color:var(--ink)}
  select{height:58px;padding:0 14px;font-size:18px;font-weight:700} .amount{display:flex;align-items:center;border-bottom:3px solid #ffab91}.amount:focus-within{outline:3px solid #ffd4c7;outline-offset:4px;border-radius:7px}.amount input{height:68px;border:0;border-radius:0;padding:0;background:transparent;font-size:38px;font-weight:800;outline:0;appearance:textfield}.amount input::-webkit-inner-spin-button,.amount input::-webkit-outer-spin-button{appearance:none}.amount span{font-weight:800;color:var(--muted);padding:0 7px}
  .date-control{position:relative;display:flex;align-items:center;min-height:52px;border-bottom:1px solid var(--line)}.date-text{font-size:18px;font-weight:700;padding:8px 2px}.date-control::after{content:"▾";margin-left:auto;color:var(--muted)}.date-control input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .subitems{margin-top:12px;padding:14px;border-radius:15px;background:#fff8f4;border:1px solid var(--line)}.subitems[hidden]{display:none}.subitems .label{font-size:14px;margin-bottom:8px}
  .choice-grid{display:grid;gap:8px}.choice-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.choice-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.choice{position:relative;min-width:0}.choice input{position:absolute;opacity:0;pointer-events:none}.choice span{display:flex;min-height:48px;align-items:center;justify-content:center;padding:7px 5px;border:1.5px solid #e2d8d1;border-radius:11px;background:#fff;text-align:center;font-size:13px;font-weight:650;color:#5e534e}.choice input:checked+span{border-color:var(--coral);background:var(--coral-pale);color:#9c3d34;font-weight:800}.choice input:checked+span::before{content:"✓";font-size:12px;margin-right:3px}.choice input:focus-visible+span{outline:3px solid #79c5bc;outline-offset:2px}
  .purpose{margin-top:30px;padding-top:22px;border-top:2px solid #f1e1d8}.purpose .section-title{margin-bottom:10px;color:#7f5147;font-size:15px;font-weight:850}.purpose .choice span{min-height:58px;font-size:15px}
  .characteristics{margin-top:24px}.characteristics .section-title{font-size:15px;font-weight:850;margin-bottom:10px}.feature-groups{display:grid;grid-template-columns:1fr 1fr;gap:14px}.feature-name{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}.feature-groups .choice-grid{gap:5px}.feature-groups .choice span{min-height:42px;font-size:12px}
  /* 青緑=生活に必要・毎月・固定費 / ピンク=ゆとり・不定期・変動費 */
  .purpose input[value="生活に必要"]+span,.feature-groups input[name="frequency"][value="毎月"]+span,.feature-groups input[name="nature"][value="固定"]+span{border-color:#9bd6ce;background:#e9f7f4;color:#35736c}
  .purpose input[value="ゆとり"]+span,.feature-groups input[name="frequency"][value="不定期"]+span,.feature-groups input[name="nature"][value="変動"]+span{border-color:#ffc4b6;background:#fff0eb;color:#a34b41}
  .purpose input[value="生活に必要"]:checked+span,.feature-groups input[name="frequency"][value="毎月"]:checked+span,.feature-groups input[name="nature"][value="固定"]:checked+span{border-color:#3f9f95;background:#4db6ac;color:#fff;box-shadow:0 3px 8px rgba(53,143,135,.2)}
  .purpose input[value="ゆとり"]:checked+span,.feature-groups input[name="frequency"][value="不定期"]:checked+span,.feature-groups input[name="nature"][value="変動"]:checked+span{border-color:#e56356;background:#ff6f61;color:#fff;box-shadow:0 3px 8px rgba(223,89,77,.2)}
  .memo{margin-top:22px}.memo label{display:block;margin:0 0 6px;font-size:13px;font-weight:700;color:var(--muted)}textarea{min-height:46px;padding:10px 12px;resize:vertical;font-size:14px}
  .notice{margin:15px 0 0;padding:10px 12px;border-left:3px solid #d79624;background:#fff8dd;color:#715d35;font-size:12px}.notice[hidden]{display:none}
  button,.view-button{display:flex;align-items:center;justify-content:center;width:100%;min-height:58px;border:0;border-radius:14px;font-weight:850;text-decoration:none;cursor:pointer}.submit{margin-top:20px;background:var(--coral);color:#fff;font-size:20px;box-shadow:0 5px 12px rgba(255,111,97,.25)}.submit:hover{background:var(--coral-dark)}.submit:disabled{opacity:.65;cursor:wait}.view-button{margin-top:12px;background:var(--teal);color:#fff;font-size:16px}.view-button:hover{background:#358f87}.status{min-height:22px;margin:13px 1px 0;font-size:13px;white-space:pre-wrap}.status:empty{display:none}.help{margin-top:13px;color:var(--muted);font-size:12px;text-align:center}
  @media(max-width:355px){main{padding:20px 16px}.feature-groups{gap:9px}.choice span{font-size:12px}.flow{display:none}}
</style>
</head>
<body>
<main>
  <header><h1>📒 家計簿</h1><p class="flow">選択 → 入力 → 送信</p></header>
  <form id="entry">
    <section class="block">
      <label class="label" for="category"><span class="step">1</span>何に使った？</label>
      <select id="category" name="category" aria-label="費目"></select>
      <div id="paymentItemArea" class="subitems" hidden>
        <span class="label">支払い項目</span>
        <div id="paymentItems" class="choice-grid two" role="radiogroup" aria-label="支払い項目"></div>
      </div>
    </section>

    <section class="block">
      <label class="label" for="amount"><span class="step">2</span>いくら使った？</label>
      <div class="amount"><input id="amount" name="amount" type="number" inputmode="numeric" min="1" step="1" required placeholder="0"><span>円</span></div>
    </section>

    <section class="block">
      <label class="label" for="date"><span class="step">3</span>いつ使った？</label>
      <div class="date-control"><span id="summaryDate" class="date-text" aria-hidden="true"></span><input id="date" name="date" type="date" required aria-label="使った日"></div>
    </section>

    <section class="purpose" aria-labelledby="purpose-title">
      <h2 id="purpose-title" class="section-title">使い道</h2>
      <div class="choice-grid two" role="radiogroup" aria-label="使い道">
        <label class="choice"><input type="radio" name="type" value="生活に必要" required><span>生活に必要</span></label>
        <label class="choice"><input type="radio" name="type" value="ゆとり"><span>ゆとり</span></label>
      </div>
    </section>

    <section class="characteristics" aria-labelledby="characteristics-title">
      <h2 id="characteristics-title" class="section-title">支払いの特徴</h2>
      <div class="feature-groups">
        <div><span class="feature-name">頻度</span><div class="choice-grid two" role="radiogroup" aria-label="頻度"><label class="choice"><input type="radio" name="frequency" value="毎月" required><span>毎月</span></label><label class="choice"><input type="radio" name="frequency" value="不定期"><span>不定期</span></label></div></div>
        <div><span class="feature-name">性質</span><div class="choice-grid two" role="radiogroup" aria-label="性質"><label class="choice"><input type="radio" name="nature" value="固定" required><span>固定費</span></label><label class="choice"><input type="radio" name="nature" value="変動"><span>変動費</span></label></div></div>
      </div>
    </section>

    <section class="memo"><label for="note">メモ（任意）</label><textarea id="note" name="note" rows="2" placeholder="例：家族で夕食"></textarea></section>
    <p id="investmentHint" class="notice" hidden>NISA・積立は生活支出と分けて記録します。</p>
    <button id="submit" class="submit" type="submit">送信</button>
    <a id="viewSheet" class="view-button" href="https://docs.google.com/spreadsheets/d/1CZhcauxXKsahIZyyriJDtoyZqzZGiYwYEbwW_ES-mTk/edit?gid=444457785#gid=444457785">📊 家計簿を見る</a>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <p class="help">送信後は金額とメモだけを空にします。</p>
  </form>
</main>
<script src="config.js"></script>
<script src="categories.js"></script>
<script src="app.js"></script>
</body>
</html>
